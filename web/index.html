<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#10172a">
    <title>Tabuada Quest 2.0</title>
    <link rel="stylesheet" href="./css/app.css">
</head>
<body>
    <main class="bootstrap-screen">
        <section class="bootstrap-card" aria-labelledby="title">
            <span class="badge">Tabuada Quest 2.0</span>
            <h1 id="title">Ambiente de desenvolvimento pronto</h1>
            <p>
                Esta é a mesma aplicação web que será executada no navegador
                e empacotada dentro do aplicativo Android.
            </p>

            <dl class="status-grid">
                <div>
                    <dt>Interface</dt>
                    <dd>Web</dd>
                </div>
                <div>
                    <dt>Android</dt>
                    <dd>WebView</dd>
                </div>
                <div>
                    <dt>Estado</dt>
                    <dd id="runtime-status">Inicializando...</dd>
                </div>
            </dl>
        </section>
    </main>

    <script src="./js/app.js"></script>
</body>
</html>
