    <title>Tabuada Quest 2.0</title>
    <script>
        try {
            if (window.TabuadaQuestNative) {
                document.documentElement.classList.add("tq-native-runtime");
            }
            if (
                window.matchMedia?.("(display-mode: standalone)").matches
                || window.matchMedia?.("(display-mode: fullscreen)").matches
                || window.navigator.standalone === true
            ) {
                document.documentElement.classList.add("tq-pwa-runtime");
            }
        } catch (_) {}
    </script>
    <script>
        (function () {
            function syncAppViewport() {
                var vv = window.visualViewport;
                var height = vv && vv.height ? vv.height : window.innerHeight;
                document.documentElement.style.setProperty("--tq-app-height", Math.round(height) + "px");
            }
            syncAppViewport();
            window.addEventListener("resize", syncAppViewport, { passive: true });
            window.visualViewport?.addEventListener("resize", syncAppViewport, { passive: true });
        })();
    </script>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", async () => {
                try {
                    const registration = await navigator.serviceWorker.register("./sw.js", { scope: "./" });
                    const installButton = document.getElementById("pwa-install-button");
                    let installPrompt = null;
                    const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches
                        || window.navigator.standalone === true;

                    const refreshInstallButton = () => {
                        if (!installButton) return;
                        installButton.hidden = isStandalone() || !installPrompt;
                    };

                    window.addEventListener("beforeinstallprompt", (event) => {
                        event.preventDefault();
                        installPrompt = event;
                        refreshInstallButton();
                    });

                    installButton?.addEventListener("click", async () => {
                        if (!installPrompt) return;
                        installButton.hidden = true;
                        await installPrompt.prompt();
                        await installPrompt.userChoice.catch(() => null);
                        installPrompt = null;
                        refreshInstallButton();
                    });

                    window.addEventListener("appinstalled", () => {
                        installPrompt = null;
                        if (installButton) installButton.hidden = true;
                    });
                    refreshInstallButton();
                    let refreshing = false;

                    navigator.serviceWorker.addEventListener("controllerchange", () => {
                        if (refreshing) return;
                        refreshing = true;
                        location.reload();
                    });

                    const activateWaitingUpdate = () => {
                        if (registration.waiting) {
                            registration.waiting.postMessage({ type: "SKIP_WAITING" });
                        }
                    };

                    registration.addEventListener("updatefound", () => {
                        const worker = registration.installing;
                        if (!worker) return;
                        worker.addEventListener("statechange", () => {
                            if (worker.state === "installed" && navigator.serviceWorker.controller) {
                                // The new cache finished installing. Activate only now.
                                activateWaitingUpdate();
                            }
                        });
                    });

                    // GitHub/CDN may keep the page open for hours. Recheck on launch,
                    // when connectivity returns and periodically while the game is open.
                    await registration.update().catch(() => {});
                    activateWaitingUpdate();

                    window.addEventListener("online", () => {
                        registration.update().then(activateWaitingUpdate).catch(() => {});
                    });
                    document.addEventListener("visibilitychange", () => {
                        if (document.visibilityState === "visible" && navigator.onLine) {
                            registration.update().then(activateWaitingUpdate).catch(() => {});
                        }
                    });
                    setInterval(() => {
                        if (navigator.onLine) registration.update().then(activateWaitingUpdate).catch(() => {});
                    }, 60 * 60 * 1000);
                } catch (error) {
                    console.warn("PWA offline indisponível:", error);
                }
            });
        }
    </script>
