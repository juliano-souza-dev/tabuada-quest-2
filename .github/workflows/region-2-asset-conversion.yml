name: Region 2 Asset Conversion

on:
  push:
    paths:
      - ".github/workflows/region-2-asset-conversion.yml"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Convert Region 2 assets to lossless WebP
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path("web/assets/regions/region-2")
          mapping = {
              "birades-png.png": "background.webp",
              "porto-desengocado.png": "porto_desengoncado_unlocked.webp",
              "porto-desengocado-blocked.png": "porto_desengoncado_locked.webp",
              "baia-dos-bichos.png": "baia_dos_bichos_piratas_unlocked.webp",
              "baia-dos-bichos-locked.png": "baia_dos_bichos_piratas_locked.webp",
              "fsrol-torto.png": "farol_torto_unlocked.webp",
              "fsrol-torto-locked.png": "farol_torto_locked.webp",
              "fortaleza-das-tralhas.png": "fortaleza_das_tralhas_unlocked.webp",
              "fortaleza-das-tralhas-locked.png": "fortaleza_das_tralhas_locked.webp",
              "cabo-do-mapá-impossivel.png": "cabo_do_mapa_impossivel_unlocked.webp",
              "cabo-do-mapá-impossivel-locked.png": "cabo_do_mapa_impossivel_locked.webp",
          }

          missing = [name for name in mapping if not (root / name).exists()]
          if missing:
              raise SystemExit("Missing source assets: " + ", ".join(missing))

          for source_name, target_name in mapping.items():
              source = root / source_name
              target = root / target_name
              with Image.open(source) as image:
                  frame = image.convert("RGBA") if "A" in image.getbands() else image.convert("RGB")
                  frame.save(target, "WEBP", lossless=True, method=6, exact=True)
                  with Image.open(target) as check:
                      if check.size != image.size:
                          raise SystemExit(f"Dimension mismatch: {source_name} -> {target_name}")
              source.unlink()

          print("Converted", len(mapping), "assets to lossless WebP.")
          PY

      - name: Commit converted assets
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/assets/regions/region-2
          git commit -m "chore: convert Region 2 assets to lossless WebP"
          git push origin HEAD:main
