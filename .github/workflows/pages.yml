name: Deploy Tabuada Quest PROD to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-prod
  cancel-in-progress: true

env:
  PROD_SOURCE_REPOSITORY: juliano-souza-dev/tabuada-quest-2-dev
  PROD_SOURCE_SHA: 38c05efa465f10f8862a59d1d34341eb3568065d

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PROD control repo
        uses: actions/checkout@v4

      - name: Checkout pinned game source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PROD_SOURCE_REPOSITORY }}
          ref: ${{ env.PROD_SOURCE_SHA }}
          path: _source
          persist-credentials: false

      - name: Validate production runtime
        working-directory: _source
        run: |
          node --check src/game.js
          node --check src/runtime/GameRuntime.js
          node --check src/runtime/SceneRuntime.js
          node --check src/world/WorldRuntime.js
          node --test tests/viewport-width.test.mjs
          node --test tests/world-ocean-effect.test.mjs tests/world-entity-motion.test.mjs tests/world-entity-presentation.test.mjs
          node <<'NODE'
          const fs=require('fs');
          const manifest=JSON.parse(fs.readFileSync('src/config/game.manifest.json','utf8'));
          if(manifest.auth?.required!==true)throw new Error('PROD requires auth.required=true');
          if(manifest.start?.kind!=='scene'||manifest.start?.id!=='login')throw new Error('PROD must start at scene:login');
          if(manifest.afterAuth?.kind!=='world'||!manifest.afterAuth?.id)throw new Error('PROD requires an afterAuth world route');
          const catalog=JSON.parse(fs.readFileSync('src/config/world-catalog.json','utf8'));
          const entry=(catalog.worlds||[]).find(item=>item.id===manifest.afterAuth.id);
          if(!entry?.path)throw new Error('afterAuth world missing from world catalog: '+manifest.afterAuth.id);
          const worldPath=entry.path.replace(/^\.\//,'');
          if(!fs.existsSync(worldPath))throw new Error('afterAuth world file missing: '+worldPath);
          const world=JSON.parse(fs.readFileSync(worldPath,'utf8'));
          if(!Number.isFinite(world.width)||!Number.isFinite(world.height))throw new Error('invalid production world dimensions');
          console.log('Auth entry gate OK:',manifest.start,'->',manifest.afterAuth,worldPath);
          NODE

      - name: Build production-only artifact
        run: |
          set -euxo pipefail
          rm -rf .prod-site
          mkdir -p .prod-site/src/runtime
          mkdir -p .prod-site/src/world
          mkdir -p .prod-site/src/scenes
          mkdir -p .prod-site/src/config
          mkdir -p .prod-site/src/styles

          cp -R _source/assets .prod-site/assets

          cp _source/src/game.js .prod-site/src/game.js

          cp -R _source/src/runtime/. .prod-site/src/runtime/
          cp -R _source/src/world/. .prod-site/src/world/
          rm -f .prod-site/src/world/WorldTestLauncher.js

          cp -R _source/src/scenes/. .prod-site/src/scenes/
          cp -R _source/src/config/. .prod-site/src/config/

          cp _source/src/styles/app.css .prod-site/src/styles/
          cp _source/src/styles/world-test.css .prod-site/src/styles/

          # PROD sanitization: keep controls, remove development/debug overlays and helper text.
          node <<'NODE'
          const fs=require('fs');
          const path='.prod-site/src/world/WorldRuntime.js';
          let src=fs.readFileSync(path,'utf8');
          src=src
            .replace('<section class="tq-world-hud">','<section class="tq-world-hud" hidden aria-hidden="true">')
            .replace('<div class="tq-world-help">Joystick analógico · WASD / setas<br>toque ou clique no oceano para navegar</div>','<div class="tq-world-help" hidden aria-hidden="true"></div>')
            .replace('if(this.modeEl)this.modeEl.textContent=this.mode==="edit"?"MUNDO · EDITAR":"MUNDO · PLAY";','if(this.modeEl)this.modeEl.textContent="";');
          fs.writeFileSync(path,src);
          fs.appendFileSync('.prod-site/src/styles/world-test.css','\n/* PROD: no development/debug overlays */\n.tq-world-hud,.tq-world-help{display:none!important}\n');
          NODE

          cp _source/game.html .prod-site/index.html

          # One-shot early cache reset: runs before the game module so stale workers/caches cannot pin old auth config.
          node <<'NODE'
          const fs=require('fs');
          const path='.prod-site/index.html';
          let html=fs.readFileSync(path,'utf8');
          const resetScript='<script>(()=>{const KEY="tq.prod.cache-reset.20261004-halloween-boss-all-maps";if(sessionStorage.getItem(KEY))return;sessionStorage.setItem(KEY,"1");Promise.all([("serviceWorker" in navigator?navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))):Promise.resolve()),("caches" in window?caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k)))):Promise.resolve())]).finally(()=>location.replace(location.pathname+location.search+(location.search?"&":"?")+"cachebust=20261004-halloween-boss-all-maps"+location.hash));})();</script>';
          html=html.replace('</head>',resetScript+'\n</head>');
          fs.writeFileSync(path,html);
          NODE

          cat > .prod-site/manifest.webmanifest <<'EOF'
          {
            "id": "./",
            "name": "Tabuada Quest",
            "short_name": "Tabuada Quest",
            "description": "Aventura educacional Tabuada Quest.",
            "lang": "pt-BR",
            "start_url": "./",
            "scope": "./",
            "display": "standalone",
            "display_override": ["standalone", "minimal-ui"],
            "background_color": "#081b2b",
            "theme_color": "#081b2b",
            "prefer_related_applications": false,
            "icons": [
              {
                "src": "./assets/pwa/icon-192.svg",
                "sizes": "192x192",
                "type": "image/svg+xml",
                "purpose": "any"
              },
              {
                "src": "./assets/pwa/icon-512.svg",
                "sizes": "512x512",
                "type": "image/svg+xml",
                "purpose": "any"
              }
            ]
          }
          EOF

          cat >> .prod-site/src/game.js <<'EOF'

          // PROD policy: never keep stale Service Workers or Cache Storage.
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(registration => registration.unregister()));
          }
          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map(key => caches.delete(key)));
          }
          EOF

          printf '%s\n' 'jogo.ihubenglish.com' > .prod-site/CNAME
          touch .prod-site/.nojekyll

          test ! -e .prod-site/src/dev
          test ! -e .prod-site/src/main.js
          test ! -e .prod-site/src/world/WorldTestLauncher.js
          test ! -e .prod-site/src/world/directional-ship-test.world.json
          test ! -e .prod-site/tests
          test ! -e .prod-site/scripts
          ! grep -R "DevOverlay\|WorldEditor\|data-world-export\|data-export" .prod-site/src --include='*.js'
          ! grep -R "MUNDO · PLAY\|MUNDO · EDITAR\|Joystick analógico · WASD" .prod-site/src --include='*.js'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload production site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .prod-site

      - name: Deploy PROD
        id: deployment
        uses: actions/deploy-pages@v4
