# A develop commit asks the Pages-authorized main workflow to deploy develop.
name: Trigger DEV Pages deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deployment through main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            repos/${{ github.repository }}/dispatches \
            -f event_type=deploy-develop
