name: Android Debug APK

# signed-build trigger: keystore secrets configured

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "web/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-debug.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Prepare signing keystore
        if: ${{ secrets.TQ_ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          TQ_ANDROID_KEYSTORE_BASE64: ${{ secrets.TQ_ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$TQ_ANDROID_KEYSTORE_BASE64" | base64 --decode > app/tabuadaquest-release.jks

      - name: Verify signing certificate
        if: ${{ secrets.TQ_ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          TQ_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TQ_ANDROID_KEYSTORE_PASSWORD }}
          TQ_ANDROID_KEY_ALIAS: ${{ secrets.TQ_ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -v             -keystore app/tabuadaquest-release.jks             -storepass "$TQ_ANDROID_KEYSTORE_PASSWORD"             -alias "$TQ_ANDROID_KEY_ALIAS"             | grep -E 'SHA1:|SHA256:'

      - name: Build debug APK
        env:
          TQ_ANDROID_KEYSTORE_PATH: tabuadaquest-release.jks
          TQ_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TQ_ANDROID_KEYSTORE_PASSWORD }}
          TQ_ANDROID_KEY_ALIAS: ${{ secrets.TQ_ANDROID_KEY_ALIAS }}
          TQ_ANDROID_KEY_PASSWORD: ${{ secrets.TQ_ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tabuada-quest-2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
