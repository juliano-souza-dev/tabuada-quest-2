name: World Prototype Checks

on:
  push:
    branches: [develop]
    paths:
      - "src/world/**"
      - "src/scenes/world-test-*.scene.json"
      - "tests/world-test-config.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  world-prototype:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate world prototype
        run: node --test tests/world-test-config.test.mjs
