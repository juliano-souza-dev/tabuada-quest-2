name: Temporary convert victory asset

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Convert PNG to optimized WebP
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path("web/assets/global/file_00000000c044820e89f6a1183c538dc0.png")
          dst = Path("web/assets/global/gb_win.webp")

          if not src.exists():
              print("Source PNG already removed; nothing to convert.")
              raise SystemExit(0)

          with Image.open(src) as image:
              image = image.convert("RGB")
              image.save(dst, "WEBP", quality=90, method=6)

          src.unlink()
          print(f"Created {dst} and removed {src}")
          PY

      - name: Commit asset replacement
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/assets/global/
          git commit -m "chore: optimize victory screen asset"
          git push
