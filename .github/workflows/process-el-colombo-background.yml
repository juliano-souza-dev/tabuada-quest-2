name: Process El Colombo background

on:
  push:
    paths:
      - "background.png"
      - ".github/workflows/process-el-colombo-background.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick webp

      - name: Optimize travel background
        shell: bash
        run: |
          set -euo pipefail

          SRC="background.png"
          DST="web/assets/transitions/el-colombo/images/ocean-background.webp"

          if [ ! -f "$SRC" ]; then
            echo "background.png already processed."
            test -s "$DST"
            exit 0
          fi

          mkdir -p "$(dirname "$DST")"

          before_bytes="$(stat -c%s "$SRC")"
          before_dims="$(identify -format '%wx%h' "$SRC")"

          tmp="$(mktemp --suffix=.png)"
          convert "$SRC"             -colorspace sRGB             -filter Lanczos             -resize '1440x2560>'             -strip             "$tmp"

          cwebp             -quiet             -q 88             -m 6             -mt             -sharp_yuv             "$tmp"             -o "$DST"

          test -s "$DST"

          after_bytes="$(stat -c%s "$DST")"
          after_dims="$(identify -format '%wx%h' "$DST")"

          echo "background.png: $before_dims / $before_bytes bytes -> ocean-background.webp: $after_dims / $after_bytes bytes"

          rm -f "$tmp" "$SRC"

      - name: Commit optimized background
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A background.png web/assets/transitions/el-colombo/images/ocean-background.webp

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "assets: optimize El Colombo ocean background"
          git pull --rebase origin main
          git push
