name: One-time R1 I3 asset conversion

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-r1-i3-asset.yml"
      - "web/assets/regions/region-1/challenges/a_vibrant_high_detail_pirate_island_game_ui_scene.png"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convert approved PNG to optimized WebP
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          src = "web/assets/regions/region-1/challenges/a_vibrant_high_detail_pirate_island_game_ui_scene.png"
          dst = "web/assets/regions/region-1/challenges/island-03-challenge.webp"
          image = Image.open(src).convert("RGB")
          image.save(dst, "WEBP", quality=88, method=6)
          print("converted", image.size, dst)
          PY
          rm web/assets/regions/region-1/challenges/a_vibrant_high_detail_pirate_island_game_ui_scene.png

      - name: Commit converted replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/assets/regions/region-1/challenges/
          git commit -m "asset: substituir desafio R1 I3 pelo asset aprovado"
          git push
