name: Process pet rescue global asset

on:
  push:
    paths:
      - "web/assets/global/ac5173e1-4012-4f34-b6b6-d5c2785dd8f5.png"
      - ".github/workflows/process-pet-rescue-asset.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick webp

      - name: Convert source to semantic WebP
        shell: bash
        run: |
          set -euo pipefail

          SRC="web/assets/global/ac5173e1-4012-4f34-b6b6-d5c2785dd8f5.png"
          DST="web/assets/global/pet_rescue_screen.webp"

          if [ ! -f "$SRC" ]; then
            echo "Source PNG already processed; nothing to do."
            exit 0
          fi

          SOURCE_DIMENSIONS="$(identify -format '%wx%h' "$SRC")"

          cwebp -quiet -q 95 -m 6 -sharp_yuv -alpha_q 100 "$SRC" -o "$DST"

          OUTPUT_DIMENSIONS="$(identify -format '%wx%h' "$DST")"

          if [ "$SOURCE_DIMENSIONS" != "$OUTPUT_DIMENSIONS" ]; then
            echo "Dimension mismatch: $SOURCE_DIMENSIONS -> $OUTPUT_DIMENSIONS"
            exit 1
          fi

          rm "$SRC"

          echo "Converted $SRC -> $DST"
          echo "Dimensions preserved: $OUTPUT_DIMENSIONS"
          ls -lh "$DST"

      - name: Commit converted asset
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A web/assets/global

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "assets: optimize global pet rescue screen"
          git push
