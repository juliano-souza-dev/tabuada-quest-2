name: Replace home art overlay

on:
  push:
    paths:
      - ".github/workflows/replace-home-overlay.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-overlay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download WebP asset
        run: |
          set -euo pipefail
          mkdir -p web/assets/ui
          curl -L --fail --retry 3 "https://at.adobe.com/03sDWVFicTOJr6fy" -o web/assets/ui/home-art-overlay.webp
          python - <<'PY'
          from pathlib import Path
          p = Path("web/assets/ui/home-art-overlay.webp")
          b = p.read_bytes()
          assert len(b) > 1000, f"asset too small: {len(b)}"
          assert b[:4] == b"RIFF" and b[8:12] == b"WEBP", "download is not a valid WebP"
          print(f"Verified WebP: {len(b)} bytes")
          PY

      - name: Commit replacement
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/assets/ui/home-art-overlay.webp
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "feat(ui): replace home art overlay"
          git push origin HEAD:main
