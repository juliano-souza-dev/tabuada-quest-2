# Deploy the develop branch to GitHub Pages whenever develop changes.
# The workflow file lives on main because main is the Pages-authorized branch.
name: Deploy DEV preview to Pages

on:
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-develop]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload DEV artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy DEV to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
