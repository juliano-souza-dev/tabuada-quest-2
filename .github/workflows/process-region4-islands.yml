name: Process Region 4 island assets

on:
  push:
    paths:
      - "web/assets/regions/region-4/**"
      - ".github/workflows/process-region4-islands.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick webp

      - name: Normalize and optimize unlocked islands
        shell: bash
        run: |
          set -euo pipefail

          process_asset() {
            src="$1"
            dst="$2"

            if [ ! -f "$src" ]; then
              echo "Source already processed: $src"
              return 0
            fi

            before_bytes="$(stat -c%s "$src")"
            before_dims="$(identify -format '%wx%h' "$src")"
            tmp="$(mktemp --suffix=.png)"

            convert "$src"               -colorspace sRGB               -filter Lanczos               -resize '896x896>'               -unsharp 0x0.45+0.45+0.015               -strip               "$tmp"

            cwebp               -quiet               -q 92               -alpha_q 100               -m 6               -sharp_yuv               "$tmp"               -o "$dst"

            test -s "$dst"

            after_bytes="$(stat -c%s "$dst")"
            after_dims="$(identify -format '%wx%h' "$dst")"

            echo "$(basename "$src"): $before_dims / $before_bytes bytes -> $(basename "$dst"): $after_dims / $after_bytes bytes"

            rm -f "$tmp" "$src"
          }

          process_asset             "web/assets/regions/region-4/ChatGPT Image 22 de set. de 2026, 20_59_26 (1).png"             "web/assets/regions/region-4/island-01-unlocked.webp"

          process_asset             "web/assets/regions/region-4/ChatGPT Image 22 de set. de 2026, 20_59_27 (2).png"             "web/assets/regions/region-4/island-02-unlocked.webp"

          test -s web/assets/regions/region-4/island-01-unlocked.webp
          test -s web/assets/regions/region-4/island-02-unlocked.webp

      - name: Commit processed assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A web/assets/regions/region-4

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "assets: optimize Region 4 islands 1 and 2"
          git pull --rebase origin main
          git push
