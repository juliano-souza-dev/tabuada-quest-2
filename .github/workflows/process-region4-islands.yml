name: Process Region 4 Island Assets

on:
  push:
    paths:
      - 'web/assets/regions/region-4/file_000000004cc8820ea9897c74a09cc1d5.png'
      - 'web/assets/regions/region-4/file_00000000fa48820e90945503cf3ed97a.png'
      - '.github/workflows/process-region4-islands.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick webp
      - name: Optimize Baia do Cristal pair
        shell: bash
        run: |
          set -euo pipefail
          process_asset() {
            src="$1"
            dst="$2"
            tmp="${dst%.webp}.tmp.png"
            convert "$src" -colorspace sRGB -filter Lanczos -resize '896x896>' -unsharp 0x0.45+0.45+0.015 -strip "$tmp"
            cwebp -quiet -q 90 -alpha_q 100 -m 6 -sharp_yuv "$tmp" -o "$dst"
            rm -f "$tmp"
            test -s "$dst"
          }
          process_asset "web/assets/regions/region-4/file_000000004cc8820ea9897c74a09cc1d5.png" "web/assets/regions/region-4/baia-do-cristal-unlocked.webp"
          process_asset "web/assets/regions/region-4/file_00000000fa48820e90945503cf3ed97a.png" "web/assets/regions/region-4/baia-do-cristal-locked.webp"
          rm -f web/assets/regions/region-4/file_000000004cc8820ea9897c74a09cc1d5.png
          rm -f web/assets/regions/region-4/file_00000000fa48820e90945503cf3ed97a.png
      - name: Link island 2
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("web/js/content/game-content.js")
          s=p.read_text()
          old='''                    1: Object.freeze({
                        unlocked: "./assets/regions/region-4/porto-da-geada-unlocked.webp?v=20260922-terras-gelidas-porto-v2",
                        locked: "./assets/regions/region-4/porto-da-geada-locked.webp?v=20260922-terras-gelidas-porto-v2"
                    })'''
          new='''                    1: Object.freeze({
                        unlocked: "./assets/regions/region-4/porto-da-geada-unlocked.webp?v=20260922-terras-gelidas-porto-v2",
                        locked: "./assets/regions/region-4/porto-da-geada-locked.webp?v=20260922-terras-gelidas-porto-v2"
                    }),
                    2: Object.freeze({
                        unlocked: "./assets/regions/region-4/baia-do-cristal-unlocked.webp?v=20260923-terras-gelidas-baia-v1",
                        locked: "./assets/regions/region-4/baia-do-cristal-locked.webp?v=20260923-terras-gelidas-baia-v1"
                    })'''
          if old not in s:
              raise SystemExit("Region 4 island mapping block not found")
          p.write_text(s.replace(old,new))
          PY
      - name: Commit processed assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A web/assets/regions/region-4 web/js/content/game-content.js
          git diff --cached --quiet && exit 0
          git commit -m "assets: optimize and link Region 4 Baia do Cristal pair"
          git push
