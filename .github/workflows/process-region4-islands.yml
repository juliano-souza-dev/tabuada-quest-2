name: Process Region 4 Island Assets

on:
  push:
    paths:
      - 'web/assets/regions/region-4/file_000000004cc8820ea9897c74a09cc1d5.png'
      - 'web/assets/regions/region-4/file_00000000fa48820e90945503cf3ed97a.png'
      - 'web/assets/regions/region-4/file_0000000067c8820eb893a4b6e412e499.png'
      - 'web/assets/regions/region-4/file_00000000ac28820e9821bdacc1b203f6.png'
      - 'web/assets/regions/region-4/file_0000000066fc820e8db4e3aeb313bd62.png'
      - 'web/assets/regions/region-4/file_00000000f1e0820e82ce97ba5cb3b0e9.png'
      - 'web/assets/regions/region-4/file_0000000007b0820e85f5413aa9513c2d.png'
      - 'web/assets/regions/region-4/file_000000002368820e9115b09e29de5e4b.png'
      - 'web/assets/regions/region-4/file_000000009454820eaab2003eebf76977.png'
      - '.github/workflows/process-region4-islands.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick webp
      - name: Optimize Region 4 new island pair
        shell: bash
        run: |
          set -euo pipefail
          process_asset() {
            src="$1"
            dst="$2"
            tmp="${dst%.webp}.tmp.png"
            convert "$src" -colorspace sRGB -filter Lanczos -resize '896x896>' -unsharp 0x0.45+0.45+0.015 -strip "$tmp"
            cwebp -quiet -q 90 -alpha_q 100 -m 6 -sharp_yuv "$tmp" -o "$dst"
            rm -f "$tmp"
            test -s "$dst"
          }
          if [ -f web/assets/regions/region-4/file_0000000067c8820eb893a4b6e412e499.png ]; then
            process_asset "web/assets/regions/region-4/file_0000000067c8820eb893a4b6e412e499.png" "web/assets/regions/region-4/rochedo-boreal-unlocked.webp"
            rm -f web/assets/regions/region-4/file_0000000067c8820eb893a4b6e412e499.png
          fi
          if [ -f web/assets/regions/region-4/file_00000000ac28820e9821bdacc1b203f6.png ]; then
            process_asset "web/assets/regions/region-4/file_00000000ac28820e9821bdacc1b203f6.png" "web/assets/regions/region-4/rochedo-boreal-locked.webp"
            rm -f web/assets/regions/region-4/file_00000000ac28820e9821bdacc1b203f6.png
          fi
          if [ -f web/assets/regions/region-4/file_0000000066fc820e8db4e3aeb313bd62.png ]; then
            process_asset "web/assets/regions/region-4/file_0000000066fc820e8db4e3aeb313bd62.png" "web/assets/regions/region-4/fortaleza-da-nevasca-unlocked.webp"
            rm -f web/assets/regions/region-4/file_0000000066fc820e8db4e3aeb313bd62.png
          fi
          if [ -f web/assets/regions/region-4/file_00000000f1e0820e82ce97ba5cb3b0e9.png ]; then
            process_asset "web/assets/regions/region-4/file_00000000f1e0820e82ce97ba5cb3b0e9.png" "web/assets/regions/region-4/fortaleza-da-nevasca-locked.webp"
            rm -f web/assets/regions/region-4/file_00000000f1e0820e82ce97ba5cb3b0e9.png
          fi
          if [ -f web/assets/regions/region-4/file_0000000007b0820e85f5413aa9513c2d.png ]; then
            process_asset "web/assets/regions/region-4/file_0000000007b0820e85f5413aa9513c2d.png" "web/assets/regions/region-4/coroa-do-inverno-unlocked.webp"
            rm -f web/assets/regions/region-4/file_0000000007b0820e85f5413aa9513c2d.png
          fi
          if [ -f web/assets/regions/region-4/file_000000002368820e9115b09e29de5e4b.png ]; then
            process_asset "web/assets/regions/region-4/file_000000002368820e9115b09e29de5e4b.png" "web/assets/regions/region-4/coroa-do-inverno-locked.webp"
            rm -f web/assets/regions/region-4/file_000000002368820e9115b09e29de5e4b.png
          fi
      - name: Optimize Terras Gelidas background
        shell: bash
        run: |
          set -euo pipefail
          SRC="web/assets/regions/region-4/file_000000009454820eaab2003eebf76977.png"
          DST="web/assets/regions/region-4/region-04-background-v2.webp"
          if [ -f "$SRC" ]; then
            cwebp -quiet -q 86 -m 6 -sharp_yuv "$SRC" -o "$DST"
            rm -f "$SRC"
            test -s "$DST"
          fi
      - name: Link Region 4 islands
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("web/js/content/game-content.js")
          s=p.read_text()
          pattern=r'(region4Modular:\s*Object\.freeze\(\{[\s\S]*?islands:\s*Object\.freeze\(\{)([\s\S]*?)(\n\s*\}\)\n\s*\}\),\n\s*region13Modular:)'
          m=re.search(pattern,s)
          if not m:
              raise SystemExit("Region 4 islands section not found")
          body=m.group(2)
          island2='''\n                    2: Object.freeze({
                        unlocked: "./assets/regions/region-4/baia-do-cristal-unlocked.webp?v=20260923-terras-gelidas-baia-v1",
                        locked: "./assets/regions/region-4/baia-do-cristal-locked.webp?v=20260923-terras-gelidas-baia-v1"
                    })'''
          if re.search(r'\n\s*2:\s*Object\.freeze\(\{',body):
              body=re.sub(r'\n\s*2:\s*Object\.freeze\(\{[\s\S]*?\n\s*\}\)',island2,body,count=1)
          else:
              body=body.rstrip()
              if body and not body.endswith(','):
                  body += ','
              body += island2
          island3='''\n                    3: Object.freeze({
                        unlocked: "./assets/regions/region-4/rochedo-boreal-unlocked.webp?v=20260923-terras-gelidas-rochedo-v1",
                        locked: "./assets/regions/region-4/rochedo-boreal-locked.webp?v=20260923-terras-gelidas-rochedo-v1"
                    })'''
          if re.search(r'\n\s*3:\s*Object\.freeze\(\{',body):
              body=re.sub(r'\n\s*3:\s*Object\.freeze\(\{[\s\S]*?\n\s*\}\)',island3,body,count=1)
          else:
              body=body.rstrip()
              if body and not body.endswith(','):
                  body += ','
              body += island3
          island4='''\n                    4: Object.freeze({
                        unlocked: "./assets/regions/region-4/fortaleza-da-nevasca-unlocked.webp?v=20260923-terras-gelidas-ilha4-v1",
                        locked: "./assets/regions/region-4/fortaleza-da-nevasca-locked.webp?v=20260923-terras-gelidas-ilha4-v1"
                    })'''
          island5='''\n                    5: Object.freeze({
                        unlocked: "./assets/regions/region-4/coroa-do-inverno-unlocked.webp?v=20260923-terras-gelidas-ilha5-v1",
                        locked: "./assets/regions/region-4/coroa-do-inverno-locked.webp?v=20260923-terras-gelidas-ilha5-v1"
                    })'''
          for island_id, island_block in ((4,island4),(5,island5)):
              rx=rf'\n\s*{island_id}:\s*Object\.freeze\(\{{[\s\S]*?\n\s*\}}\)'
              if re.search(rx,body):
                  body=re.sub(rx,island_block,body,count=1)
              else:
                  body=body.rstrip()
                  if body and not body.endswith(','):
                      body += ','
                  body += island_block
          p.write_text(s[:m.start()]+m.group(1)+body+m.group(3)+s[m.end():])
          PY
      - name: Commit processed assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A web/assets/regions/region-4 web/js/content/game-content.js
          git diff --cached --quiet && exit 0
          git commit -m "assets: optimize and link Region 4 Rochedo Boreal pair"
          git push
