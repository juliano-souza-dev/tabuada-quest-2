name: Web Preview DEV

on:
  push:
    branches: [develop]
    paths:
      - "web/**"
      - ".github/workflows/web-preview-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@v6

      - name: Prepare isolated DEV site
        run: |
          mkdir -p _site/develop
          cp -R web/. _site/develop/
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="pt-BR">
          <head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./develop/"><title>Tabuada Quest DEV</title></head>
          <body><a href="./develop/">Abrir Tabuada Quest DEV</a></body>
          </html>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload DEV Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy DEV
        id: deployment
        uses: actions/deploy-pages@v4
