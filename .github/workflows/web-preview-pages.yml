name: Web Pages PROD + DEV

on:
  push:
    branches: [main, develop]
    paths:
      - "web/**"
      - ".github/workflows/web-preview-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout production
        uses: actions/checkout@v6
        with:
          ref: main
          path: prod

      - name: Checkout development
        uses: actions/checkout@v6
        with:
          ref: develop
          path: dev

      - name: Compose Pages site
        run: |
          mkdir -p _site/develop
          cp -R prod/web/. _site/
          cp -R dev/web/. _site/develop/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload combined site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
