name: Web Unit Tests

on:
  push:
    branches: [main]
    paths:
      - "web/js/**"
      - "tests/web/**"
      - ".github/workflows/web-unit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate web JavaScript syntax
        shell: bash
        run: |
          find web/js -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Run domain and persistence tests
        run: node --test tests/web/*.test.cjs
