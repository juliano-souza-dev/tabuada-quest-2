name: Optimize Region 14 WebP Once

on:
  push:
    branches: ["fix/issue-88-zona-rubi-webp"]
    paths:
      - "web/assets/regions/region-14/background.png"
      - ".github/workflows/region-14-webp-once.yml"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Convert background to WebP and remove Region 14 PNG
        shell: bash
        run: |
          set -euo pipefail
          source_file="web/assets/regions/region-14/background.png"
          output_file="web/assets/regions/region-14/background.webp"

          if [ ! -f "$source_file" ]; then
            echo "Region 14 background PNG already removed."
            exit 0
          fi

          sudo apt-get update
          sudo apt-get install -y webp
          cwebp -quiet -q 90 -m 6 -mt "$source_file" -o "$output_file"
          rm -f web/assets/regions/region-14/*.png

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/assets/regions/region-14

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "assets: finalize Region 14 WebP-only package"
          git push origin HEAD:"$GITHUB_REF_NAME"
