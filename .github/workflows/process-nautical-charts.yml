name: Process Nautical Charts

on:
  push:
    paths:
      - 'web/assets/global/carta-nautica-*.png'
      - '.github/workflows/process-nautical-charts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install WebP tools
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Convert nautical charts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(web/assets/global/carta-nautica-*.png)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PNG nautical charts to process."
            exit 0
          fi

          for src in "${files[@]}"; do
            dst="${src%.png}.webp"
            echo "Processing $src -> $dst"
            cwebp -quiet -q 88 -m 6 -sharp_yuv -mt "$src" -o "$dst"
            test -s "$dst"
            rm -f "$src"
          done

      - name: Commit optimized nautical charts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A web/assets/global
          git diff --cached --quiet && exit 0
          git commit -m "assets: optimize nautical chart images"
          git push
